<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame Robot</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #ECECEC">
    <!-- 床 -->
    <a-plane position="0 0 -4" rotation="-90 0 0" width="8" height="8" color="#7BC8A4" shadow></a-plane>

    <!-- ロボット本体-->
    <a-entity id="robot" position="0 0 -3.5" animation="property: rotation; from: 0 -15 0; to: 0 15 0; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine">
      <!-- 胴体 -->
      <a-box position="0 1.2 0" width="1.1" height="1.2" depth="0.7" color="#4CC3D9" shadow></a-box>
      <!-- 胸のパネル・ボタン -->
      <a-box position="0 1.35 0.36" width="0.6" height="0.35" depth="0.05" color="#2B3A42" shadow></a-box>
      <a-sphere position="-0.15 1.35 0.39" radius="0.06" color="#EF2D5E"></a-sphere>
      <a-sphere position="0.15 1.35 0.39" radius="0.06" color="#FFC65D"></a-sphere>

      <!-- 首 -->
      <a-cylinder position="0 1.9 0" radius="0.22" height="0.25" color="#9AA5B1" shadow></a-cylinder>

      <!-- 頭 -->
      <a-box position="0 2.35 0" width="0.9" height="0.7" depth="0.7" color="#E2E8F0" shadow></a-box>
      <!-- 目 -->
      <a-sphere position="-0.2 2.4 0.36" radius="0.09" color="#1E293B"></a-sphere>
      <a-sphere position="0.2 2.4 0.36" radius="0.09" color="#1E293B"></a-sphere>
      <!-- アンテナ -->
      <a-cylinder position="0 2.85 0" radius="0.03" height="0.35" color="#9AA5B1"></a-cylinder>
      <a-sphere position="0 3.05 0" radius="0.09" color="#EF2D5E"></a-sphere>

      <!-- 左腕 -->
      <a-cylinder position="-0.75 1.3 0" rotation="0 0 0" radius="0.14" height="0.9" color="#FFC65D" shadow></a-cylinder>
      <a-sphere position="-0.75 0.82 0" radius="0.16" color="#2B3A42" shadow></a-sphere>

      <!-- 右腕 -->
      <a-cylinder position="0.75 1.3 0" rotation="0 0 0" radius="0.14" height="0.9" color="#FFC65D" shadow></a-cylinder>
      <a-sphere position="0.75 0.82 0" radius="0.16" color="#2B3A42" shadow></a-sphere>

      <!-- 左足 -->
      <a-cylinder position="-0.3 0.54 0" radius="0.18" height="0.7" color="#4CC3D9" shadow></a-cylinder>
      <a-box position="-0.3 0.08 0.08" width="0.36" height="0.16" depth="0.5" color="#2B3A42" shadow></a-box>

      <!-- 右足 -->
      <a-cylinder position="0.3 0.54 0" radius="0.18" height="0.7" color="#4CC3D9" shadow></a-cylinder>
      <a-box position="0.3 0.08 0.08" width="0.36" height="0.16" depth="0.5" color="#2B3A42" shadow></a-box>
    </a-entity>
  </a-scene>
</body>
</html>
